[project]
name = "sourcemode-engine"
version = "0.1.0"
description = "SourceMode pipeline engine: consistent-character video via ComfyUI + Wan 2.2"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "requests>=2.31",
    "rich>=13.0",
]

[project.optional-dependencies]
gates = ["insightface>=0.7", "onnxruntime-gpu>=1.17", "numpy>=1.26", "opencv-python-headless>=4.9", "pillow>=10.0"]
# resemble-perth (chatterbox's audio watermarker) imports pkg_resources without
# declaring setuptools; without it perth silently sets PerthImplicitWatermarker
# to None and chatterbox dies with "'NoneType' object is not callable".
voice = ["chatterbox-tts>=0.1", "setuptools>=70,<81"]
# Pose transfer: mediapipe measures the pose, rembg restores the alpha cutout.
# Both in-process — the original tool shelled out to two separate venvs.
pose = ["mediapipe>=1.0", "rembg>=2.0", "numpy>=1.26", "pillow>=10.0"]
db = ["psycopg[binary]>=3.1"]
# In-game asset cutouts (sourcemode assets cutout): rembg matting, numpy for the alpha report.
assets = ["rembg>=2.0", "numpy>=1.26", "pillow>=10.0"]
# Live readout service (sourcemode monitor serve); psutil finds the trainer process.
monitor = ["fastapi>=0.110", "uvicorn>=0.29", "psutil>=5.9"]

[project.scripts]
sourcemode = "sourcemode.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

# chatterbox-tts -> pkuseg 0.0.25 has a setup.py that imports numpy but never
# declares it as a build dependency, so it fails under uv's isolated builds.
[tool.uv.extra-build-dependencies]
pkuseg = ["numpy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sourcemode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
markers = [
    "gpu: integration test needing a running ComfyUI with real models (skips cleanly otherwise)",
]
